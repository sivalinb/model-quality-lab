[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "model-quality-lab"
version = "0.1.0"
description = "A hands-on model evaluation, observability, and release engineering lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3",
  "scikit-learn>=1.6,<2", "scipy>=1.14,<2", "prometheus-client>=0.21,<1",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "openinference-semantic-conventions>=0.1,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "matplotlib>=3.9,<4", "psutil>=6,<8", "markdown>=3.7,<4"]
kafka = ["confluent-kafka>=2.6,<3"]

[project.scripts]
mql = "model_quality_lab.cli:main"

[tool.setuptools.packages.find]
include = ["model_quality_lab*"]

[tool.setuptools.package-data]
model_quality_lab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
