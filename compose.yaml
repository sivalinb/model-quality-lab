services:
  api:
    build: .
    ports: ["127.0.0.1:7856:7856"]
    environment:
      MQL_KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    volumes: ["lab-state:/app/.runtime"]
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
  worker:
    build: .
    command: ["python","-m","model_quality_lab.streaming"]
    environment:
      MQL_KAFKA_BROKERS: kafka:9092
      MQL_CLICKHOUSE_URL: http://clickhouse:8123
      MQL_CLICKHOUSE_USER: mql
      MQL_CLICKHOUSE_PASSWORD: local-lab
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    volumes: ["lab-state:/app/.runtime"]
    restart: on-failure
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-state:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL","/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    ports: ["127.0.0.1:8127:8123"]
    environment:
      CLICKHOUSE_USER: mql
      CLICKHOUSE_PASSWORD: local-lab
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: ["analytics-state:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD-SHELL","clickhouse-client --user mql --password local-lab --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9096:9090"]
    volumes: ["./observability/prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3016:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
  collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    ports: ["127.0.0.1:16696:16686"]
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
volumes:
  lab-state:
  kafka-state:
  analytics-state:
